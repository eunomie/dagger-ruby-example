[modules.rubocop]
source = "dagger.io/ruby/rubocop@v1"

[modules.bundler-audit]
source = "dagger.io/ruby/bundler-audit@v1"

[modules.brakeman]
source = "dagger.io/ruby/brakeman@main"

[modules.ruby-sdk]
source = "dagger.io/sdk/ruby@v1.4.0"

[sdks.ruby]
module = "ruby-sdk"

[sdks.ruby.scopes."."]
clients = ["./.dagger/modules/postgres"]

[sdks.ruby.scopes.".dagger/modules/postgres"]
is-module = true
name = "postgres"

[modules.dagger-ruby-example-dev]
main = true
source = ".dagger/modules/dagger-ruby-example-dev"

[sdks.ruby.scopes.".dagger/modules/dagger-ruby-example-dev"]
is-module = true
clients = ["dagger.io/ruby/ruby@v1"]

[modules.rails]
source = "dagger.io/ruby/rails@v1"

[modules.rails.check]
skip = ["tests/test"]
