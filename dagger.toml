[modules.rubocop]
source = "github.com/dagger/ruby/rubocop@main"

[modules.bundler-audit]
source = "github.com/dagger/ruby/bundler-audit@main"

[modules.brakeman]
source = "github.com/dagger/ruby/brakeman@main"

[modules.ruby-sdk]
source = "github.com/dagger/ruby-sdk@v1.1.0"

[sdks.ruby]
module = "ruby-sdk"

[sdks.ruby.scopes."."]
clients = ["./.dagger/modules/postgres"]

[sdks.ruby.scopes.".dagger/modules/postgres"]
is-module = true
name = "postgres"

[modules.dagger-ruby-example-dev]
main = true
source = ".dagger/modules/dagger-ruby-example-dev"

[sdks.ruby.scopes.".dagger/modules/dagger-ruby-example-dev"]
is-module = true
clients = ["github.com/dagger/ruby/ruby@11179d8121ce13f4eff461bd5564e9c0db05787e"]

[modules.rails]
source = "github.com/dagger/ruby/rails"

[modules.rails.check]
skip = ["test"]
